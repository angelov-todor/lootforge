steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/lootforge-core"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/lootforge-core"

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "deploy"
      - "lootforge-core"
      - "--image=gcr.io/$PROJECT_ID/lootforge-core"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=256Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CORS_ORIGINS=https://lootforge-ui-${_HASH}-uc.a.run.app"

images:
  - "gcr.io/$PROJECT_ID/lootforge-core"
