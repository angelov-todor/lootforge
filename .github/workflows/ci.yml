name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: core/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./cmd/server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push backend
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lootforge/core core/
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lootforge/core

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy lootforge-core \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lootforge/core \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 10 \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}"

      - name: Get backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe lootforge-core --region us-central1 --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ steps.backend-url.outputs.url }} \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lootforge/ui ui/
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lootforge/ui

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy lootforge-ui \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/lootforge/ui \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1

      - name: Get frontend URL
        id: ui-url
        run: |
          URL=$(gcloud run services describe lootforge-ui --region us-central1 --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Update backend CORS with frontend URL
        run: |
          gcloud run services update lootforge-core \
            --region us-central1 \
            --update-env-vars "CORS_ORIGINS=${{ steps.ui-url.outputs.url }}"

      - name: Print service URLs
        run: |
          echo "Backend: ${{ steps.backend-url.outputs.url }}"
          echo "Frontend: ${{ steps.ui-url.outputs.url }}"
