services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    command: >
      gcloud beta emulators firestore start
      --host-port=0.0.0.0:8081
      --project=lootforge-dev
    ports:
      - "8081:8081"

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8081
      - GOOGLE_CLOUD_PROJECT=lootforge-dev
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - firestore-emulator

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://core:8080
    depends_on:
      - core
